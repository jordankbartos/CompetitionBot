services:
  dynamodb-local:
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    image: "amazon/dynamodb-local:latest"
    container_name: dynamodb-local

    volumes:
      - "./dynamodb:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "java -jar DynamoDBLocal.jar -help || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: poker-db-init
    depends_on:
      dynamodb-local:
        condition: service_healthy
    env_file: ../.env
    command: ["python", "scripts/init_local_db.py"]
    volumes:
      - ..:/app
    network_mode: host


  bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: poker-bridge
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file: ../.env
    ports:
      - "5000:5000"
    volumes:
      - ..:/app
    network_mode: host


  ngrok:
    image: ngrok/ngrok:latest
    container_name: poker-ngrok
    restart: always
    env_file: ../.env
    command:
      - "http"
      - "5000"
    network_mode: host
